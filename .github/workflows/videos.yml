# Vidéos TikTok / Reels du jour : fabriquées chaque matin à partir des matchs NBA de la nuit à venir, puis déposées
# dans une « release » GitHub du jour (videos-AAAA-MM-JJ), que Tim reçoit vers 8 h. Rien n'est publié sur les réseaux.
# Le matin, GitHub lance souvent les passages planifiés avec 30 à 60 minutes de retard : d'où le départ prévu à 6 h 20
# (heure de Paris) et un passage de secours à 7 h 05. Le premier qui part fabrique, l'autre ne fait rien.
name: Vidéos du jour
on:
  schedule:
    # GitHub ne connaît que l'heure UTC : chaque passage a deux horaires, et le job « horaire » garde celui qui
    # tombe à la bonne heure de Paris (heure d'hiver ou d'été).
    - cron: "20 4 * * *" # 6 h 20 à Paris l'été
    - cron: "20 5 * * *" # 6 h 20 à Paris l'hiver
    - cron: "5 5 * * *" # 7 h 05 l'été : secours
    - cron: "5 6 * * *" # 7 h 05 l'hiver : secours
  workflow_dispatch:
    inputs:
      d:
        description: "Date NBA (AAAAMMJJ), vide = aujourd'hui"
        required: false
  push:
    branches: [main]
    paths: [".github/workflows/videos.yml", "video/**"]
permissions:
  contents: write
concurrency:
  group: videos
  cancel-in-progress: false
jobs:
  horaire:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.h.outputs.go }}
    steps:
      - id: h
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          go=true
          if [ "$EVENT" = "schedule" ]; then
            OFF=$(TZ=Europe/Paris date +%z) # +0100 l'hiver, +0200 l'été
            case "$CRON|$OFF" in
              "20 5 * * *|+0100"|"20 4 * * *|+0200"|"5 6 * * *|+0100"|"5 5 * * *|+0200")
                # un seul passage fabrique : rien à faire si le jour est déjà traité (vidéos ou « pas de match »)
                DATE=$(TZ=America/New_York date +%Y-%m-%d)
                if gh release view "videos-$DATE" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then go=false
                elif gh release view videos-etat --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | grep -q "^$DATE"; then go=false
                else go=true; fi ;;
              *) go=false ;;
            esac
          fi
          echo "Passage $EVENT ${CRON} (Paris $(TZ=Europe/Paris date +%H:%M)) : fabrication = $go"
          echo "go=$go" >> "$GITHUB_OUTPUT"
  videos:
    needs: horaire
    if: needs.horaire.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Matchs du jour
        id: jour
        env:
          INPUT_D: ${{ github.event.inputs.d }}
        run: |
          D="$INPUT_D"
          [ -z "$D" ] && D=$(TZ=America/New_York date +%Y%m%d)
          [[ "$D" =~ ^[0-9]{8}$ ]] || { echo "Date invalide : $D"; exit 1; }
          echo "D=$D" >> "$GITHUB_ENV"
          curl -sf --retry 4 --retry-delay 30 --retry-all-errors "https://basketlog-app.com/api/videos?d=$D&lang=en" -o jour.json
          N=$(python3 -c "import json; j = json.load(open('jour.json')); print(sum(1 for g in j.get('games') or [] if g.get('state', 'pre') == 'pre'))")
          echo "$N matchs à venir le $D"
          echo "n=$N" >> "$GITHUB_OUTPUT"
      # « videos-etat » : une seule release dont le texte dit où en est le jour (lue par la livraison de 8 h)
      - name: État du jour (pas de match)
        if: github.event_name != 'push' && steps.jour.outputs.n == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="${D:0:4}-${D:4:2}-${D:6:2} : pas de match NBA ce soir (vérifié à $(TZ=Europe/Paris date +%H:%M), heure de Paris)."
          if gh release view videos-etat > /dev/null 2>&1; then gh release edit videos-etat --notes "$NOTE"
          else gh release create videos-etat --title "État des vidéos du jour" --notes "$NOTE" --latest=false; fi
      - uses: actions/setup-node@v4
        if: steps.jour.outputs.n != '0'
        with:
          node-version: 22
          cache: npm
      - if: steps.jour.outputs.n != '0'
        run: npm ci
      - uses: actions/setup-python@v5
        if: steps.jour.outputs.n != '0'
        with:
          python-version: "3.12"
      - name: Outils (ffmpeg, emoji, Chromium, voix)
        if: steps.jour.outputs.n != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          pip install -q playwright "sherpa-onnx==1.12.40" soundfile scipy numpy
          python -m playwright install --with-deps chromium > /dev/null
          bash video/setup.sh
      - name: Fabrication
        if: steps.jour.outputs.n != '0'
        run: python3 video/make.py --day jour.json --out out
      # Après une modification du code (push), les vidéos sont seulement gardées 3 jours comme résultat du test :
      # la release du jour, celle que Tim reçoit, ne change pas.
      - name: Résultat du test (après une modification)
        if: github.event_name == 'push' && steps.jour.outputs.n != '0'
        uses: actions/upload-artifact@v4
        with:
          name: videos-test
          path: out/
          retention-days: 3
          if-no-files-found: ignore
      - name: Dépôt dans la release du jour
        if: github.event_name != 'push' && steps.jour.outputs.n != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.jour.outputs.n }}
        run: |
          DATE="${D:0:4}-${D:4:2}-${D:6:2}"
          DIR="out/$DATE"
          if [ ! -f "$DIR/videos.json" ]; then echo "Aucune vidéo (pas de match ?)"; exit 0; fi
          TAG="videos-$DATE"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$DIR"/*.mp4 "$DIR/legendes.txt" "$DIR/videos.json" --clobber
          else
            gh release create "$TAG" "$DIR"/*.mp4 "$DIR/legendes.txt" "$DIR/videos.json" --title "Vidéos du $DATE" \
              --notes "Vidéos TikTok / Reels du $DATE, fabriquées automatiquement à partir des matchs NBA. Rien n'est publié sur les réseaux sociaux." --latest=false
          fi
          NOTE="$DATE : $N matchs, vidéos prêtes dans la release videos-$DATE (fabriquées à $(TZ=Europe/Paris date +%H:%M), heure de Paris)."
          if gh release view videos-etat > /dev/null 2>&1; then gh release edit videos-etat --notes "$NOTE"
          else gh release create videos-etat --title "État des vidéos du jour" --notes "$NOTE" --latest=false; fi
