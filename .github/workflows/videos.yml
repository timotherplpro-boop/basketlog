# Vidéos TikTok / Reels du jour : fabriquées chaque après-midi à partir des matchs NBA de la nuit, puis déposées dans
# une « release » GitHub du jour (videos-AAAA-MM-JJ). Rien n'est publié sur les réseaux sociaux.
name: Vidéos du jour
on:
  schedule:
    - cron: "30 15 * * *" # 16 h 30 à Paris l'hiver, 17 h 30 l'été
  workflow_dispatch:
    inputs:
      d:
        description: "Date NBA (AAAAMMJJ), vide = aujourd'hui"
        required: false
  push:
    branches: [main]
    paths: [".github/workflows/videos.yml", "video/**"]
permissions:
  contents: write
concurrency:
  group: videos
  cancel-in-progress: false
jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils (ffmpeg, emoji, Chromium, voix)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          pip install -q playwright "sherpa-onnx==1.12.40" soundfile scipy numpy
          python -m playwright install --with-deps chromium > /dev/null
          bash video/setup.sh
      - name: Matchs du jour
        run: |
          D="${{ github.event.inputs.d }}"
          [ -z "$D" ] && D=$(TZ=America/New_York date +%Y%m%d)
          echo "D=$D" >> "$GITHUB_ENV"
          curl -sf --retry 3 --retry-delay 20 "https://basketlog-app.com/api/videos?d=$D" -o jour.json
          python3 -c "import json; j = json.load(open('jour.json')); print(len(j['games']), 'matchs le', j['d'])"
      - name: Fabrication
        run: python3 video/make.py --day jour.json --out out
      # Après une modification du code (push), les vidéos sont seulement gardées 3 jours comme résultat du test :
      # la release du jour, celle que Tim reçoit, ne change pas.
      - name: Résultat du test (après une modification)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: videos-test
          path: out/
          retention-days: 3
          if-no-files-found: ignore
      - name: Dépôt dans la release du jour
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="${D:0:4}-${D:4:2}-${D:6:2}"
          DIR="out/$DATE"
          if [ ! -f "$DIR/videos.json" ]; then echo "Aucune vidéo (pas de match ?)"; exit 0; fi
          TAG="videos-$DATE"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$DIR"/*.mp4 "$DIR/legendes.txt" "$DIR/videos.json" --clobber
          else
            gh release create "$TAG" "$DIR"/*.mp4 "$DIR/legendes.txt" "$DIR/videos.json" --title "Vidéos du $DATE" \
              --notes "Vidéos TikTok / Reels du $DATE, fabriquées automatiquement à partir des matchs NBA. Rien n'est publié sur les réseaux sociaux." --latest=false
          fi
